[package]
name = "tigt-gfxreader"
version = "0.1.0"
edition = "2021"
license = "MIT-0"
publish = false
description = "Replay tigt terminal graphics and verify exact font masks and colors"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vte = "0.15"
unicode-width = "0.2"

[dev-dependencies]
cc = "1"
libc = "0.2"
pkg-config = "0.3"
tempfile = "3"
