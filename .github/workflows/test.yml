name: Test
# Hosted cross-private-repository access is optional; local Docker is the default.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tigt
          ssh-key: ${{ secrets.REPOSITORY_SSH_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: sbooks-org/tigt-gfxreader
          path: tigt-gfxreader
          fetch-depth: 0
          # SSH key with read access to both private repositories.
          ssh-key: ${{ secrets.REPOSITORY_SSH_KEY }}
      - name: Build Linux test image
        run: docker build -t tigt-ci tigt/ci
      - name: Test both projects without container credentials
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/tigt:/source/tigt:ro" \
            -v "$GITHUB_WORKSPACE/tigt-gfxreader:/source/tigt-gfxreader:ro" \
            tigt-ci
