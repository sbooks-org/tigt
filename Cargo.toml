[package]
name = "tigt"
version = "0.3.0"
edition = "2024"
description = "tty-in-glass-tty: terminal rendering and transport-neutral input"
license = "MIT-0"
repository = "ssh://git@github.com/sbooks-org/tigt.git"
links = "tigt"
build = "build.rs"

[workspace]
members = ["."]
exclude = ["keyboard"]
resolver = "3"

[lib]
path = "rust/lib.rs"

[features]
default = []
keyboard = ["dep:pc-xt-keyboard"]
# Optional libcaca bitmap-to-ASCII converter; requires pkg-config package caca.
libcaca = []
# Opt-in development consumer used by cross-language integration tests.
test-fixtures = []

[dependencies]
libc = "0.2"
pc-xt-keyboard = { path = "keyboard", optional = true, default-features = false }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tigt-gfxreader = { git = "ssh://git@github.com/sbooks-org/tigt-gfxreader.git", rev = "2cb76de904f9a7397a57253704a7265a00ff06ab" }
cc = "1"
flate2 = "1"
libc = "0.2"
pkg-config = "0.3"
tempfile = "3"
png = "0.17"
serde_json = "1"

[[bin]]
name = "tigt-snapshot-fixture"
path = "tests/fixtures/snapshot.rs"
required-features = ["test-fixtures"]
test = false
bench = false

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "keyboard"
path = "examples/keyboard.rs"
required-features = ["keyboard"]
